.btn:disabled{opacity:0.5;pointer-events:none}
.progress{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:16px;display:none}
.progress.show{display:block}
.progress-bar{height:100%;width:0%;background:var(--gold);transition:width 0.3s}
.status{margin-top:16px;font-size:14px;font-weight:700;color:var(--dim)}

    "بيتزا وفطائر": "pizza,flatbread",
    "مقبلات باردة": "middle-eastern-mezze,salad,hummus",
    "وجبات ساخنة": "chicken-meal,hot-food",
    "مقبلات ساخنة": "fried-potatoes,hot-appetizer",
    "فتات": "fatteh,middle-eastern-food",
    "فرابتشينو وعصائر": "milkshake,smoothie,dessert-drink",
    "كوكتيلات ومشروبات باردة": "fresh-juice,cold-drink"
  };

  function dishPhotoTags(item) {
    const n = item.name;
    const rules = [
      [/شاي|زهورات|ظرف شاي/, "tea,cup-of-tea"], [/اسبريسو/, "espresso,espresso-coffee"], [/قهوة/, "arabic-coffee,coffee-cup"], [/كابتشينو/, "cappuccino,latte-art"], [/كمون وليمون/, "lemon-herbal-tea"], [/ليمون وزنجبيل/, "ginger-lemon-tea"], [/هوت شوكلت/, "hot-chocolate"], [/نسكافيه/, "instant-coffee,milk-coffee"], [/ميلو/, "milo-chocolate-drink"], [/معسل|تنباك|راس اركيلة|دربيج صحي/, "hookah,shisha"], [/فروج|دجاج|جوانح|زنجر|كريسبي|سبايسي|بروستد|ناغتس|فيليه|كوردون بلو/, "crispy-fried-chicken"], [/كبة/, "grilled-kibbeh,kibbeh"], [/منسف دجاج/, "chicken-mansaf,rice-chicken"], [/منسف لحمة/, "meat-mansaf,rice-lamb"], [/شقف|كباب|شيش|طوشكا|لحمة بالصنعية|قلاية باللحمة|مسخن باللحمة/, "grilled-meat-kebab"], [/شاورما/, "chicken-shawarma"], [/برك شاورما/, "shawarma-pastry"], [/مكسيكانو/, "mexican-chicken-sandwich"], [/فاهيتا/, "chicken-fajitas"], [/فرانشيسكو/, "chicken-francesco-sandwich"], [/سكالوب/, "chicken-schnitzel"], [/برغر|همبرغر/, "hamburger-burger"], [/بيتزا الفصول/, "four-seasons-pizza"], [/بيتزا سجق/, "sausage-pizza"], [/بيتزا مرغريتا/, "margherita-pizza"], [/بيتزا/, "pizza"], [/زعتر/, "zaatar-manakish"], [/فليفلة/, "pepper-cheese-pastry"], [/مرتديال/, "mortadella-cheese-sandwich"], [/قشقوان|جبنة/, "cheese-pastry"], [/زيتون/, "olive-flatbread"], [/حمص/, "hummus"], [/متبل/, "moutabal-baba-ganoush"], [/بابا غنوج/, "baba-ganoush"], [/محشي بندورة/, "stuffed-tomatoes"], [/كول سلو/, "coleslaw"], [/محمرة/, "muhammara-red-pepper-dip"], [/مكدوس/, "makdous-stuffed-eggplant"], [/مخلل/, "middle-eastern-pickles"], [/عيران|لبن/, "ayran-yogurt-drink"], [/سلطة سيزر/, "caesar-salad"], [/تبولة/, "tabbouleh"], [/فتوش/, "fattoush"], [/جرجير/, "arugula-salad"], [/بطاطا|بطاطس/, "potato-fries"], [/رز/, "rice-dish"], [/فتة حلبية/, "aleppo-fatteh"], [/فتة صاجية/, "saj-fatteh"], [/فتة دجاج/, "chicken-fatteh"], [/فتة حمص/, "hummus-fatteh"], [/موز/, "banana-milkshake"], [/فريز/, "strawberry-milkshake"], [/شوكولا|شوكل/, "chocolate-milkshake"], [/أوريو/, "oreo-milkshake"], [/افوكادو/, "avocado-smoothie"], [/كريب/, "crepe-dessert"], [/كيوي/, "kiwi-smoothie"], [/ليمون فريش|ليمون$/, "fresh-lemon-juice"], [/بولو/, "lemon-mint-drink"], [/منغا/, "mango-juice"], [/أناناس/, "pineapple-juice"], [/برتقال/, "fresh-orange-juice"], [/رمان/, "pomegranate-juice"], [/توت شامي/, "mulberry-juice"], [/فريز$/, "strawberry-juice"], [/غراندين/, "grenadine-drink"], [/بيبسي|كولا/, "cola-soft-drink"], [/سفن اب|سكن اب/, "lemon-lime-soda"], [/ميرندا تفاح/, "apple-soda"], [/ميرندا/, "orange-soda"]
    ];
    for (const [pattern, tags] of rules) {
      if (pattern.test(n)) return tags;
    }
    return CATEGORY_PHOTO_TAGS[item.cat] || "restaurant-food";
  }

  function dishPhotoUrl(item, index) {
    const tags = dishPhotoTags(item);
    return `https://loremflickr.com/720/540/${encodeURIComponent(tags)}?lock=${index + 1201}`;
  }

  const SETTINGS = {
    name: "بيت الباشا", subtitle: "حيث تلتقي نكهة الضيافة بأجواء الراحة",
    status: "مفتوح الآن", statusType: "open",
    whatsapp: "", whatsappDisplay: "", phone: "", phoneDisplay: "",
    address: "", mapUrl: "", heroImage: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600&q=80",
    logoType: "svg", logoUrl: "", theme: "royal", menuLayout: "grid",
    categoryOrder: [],
    showHero: true, showCallButton: true, showWhatsapp: true, showStatus: true,
    showPopular: false, showOffers: false, showPrepTime: false
  };

  $("btn").onclick = async () => {
    if (!confirm("هل أنت متأكد؟ سيتم استبدال البيانات الحالية.")) return;
    const btn = $("btn");
    btn.disabled = true; btn.textContent = "⏳ جاري الترحيل...";
    $("progress").classList.add("show"); $("progressBar").style.width = "20%";
    $("status").textContent = "جاري تجهيز الأصناف...";

    try {
      const itemsWithIds = ITEMS.map((item, i) => ({
        id: genId() + i.toString(36),
        category: item.cat, name: item.name, price: item.price, description: "",
        imageUrl: dishPhotoUrl(item, i), isPopular: false, isOffer: false, offerPrice: 0, prepTime: 0, createdAt: Date.now()
      }));

      $("progressBar").style.width = "60%"; $("status").textContent = "جاري رفع الأصناف إلى Firebase...";
      await setDoc(doc(db, "menu", "all"), { items: itemsWithIds });

      $("progressBar").style.width = "90%"; $("status").textContent = "جاري حفظ الإعدادات...";
      await setDoc(doc(db, "settings", "info"), SETTINGS);

      $("progressBar").style.width = "100%"; $("status").textContent = "✅ تم الترحيل بنجاح!";
      $("status").className = "status success"; btn.textContent = "✅ تم الترحيل";

    } catch (err) {
      console.error(err);
      $("status").textContent = "❌ فشل: " + (err.message || "خطأ غير معروف");
      $("status").className = "status error"; btn.disabled = false; btn.textContent = "🚀 إعادة المحاولة"; $("progressBar").style.width = "0%";
    }
  };
</script>
